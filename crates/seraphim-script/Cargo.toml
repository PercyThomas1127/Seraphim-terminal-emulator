[package]
name = "seraphim-script"
description = "Seraphim scripting runtime: sandboxed Lua extensions"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
seraphim-events.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
libc.workspace = true
mlua = { version = "0.12", features = ["lua54", "vendored", "serde", "send"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
