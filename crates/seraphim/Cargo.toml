[package]
name = "seraphim"
description = "Seraphim terminal environment"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
seraphim-terminal.workspace = true
seraphim-session.workspace = true
seraphim-pty.workspace = true
seraphim-events.workspace = true
seraphim-render.workspace = true
seraphim-config.workspace = true
seraphim-visual.workspace = true
seraphim-script.workspace = true
wgpu.workspace = true
winit.workspace = true
png.workspace = true
pollster.workspace = true
arboard.workspace = true
toml.workspace = true
libc.workspace = true
serde_json.workspace = true
serde.workspace = true
unicode-width.workspace = true
toml_edit = "0.25"

# X11: the window's background color (what X shows in a newly uncovered
# area before Seraphim's next frame). winit already loads libX11.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
x11-dl = "2.21"
