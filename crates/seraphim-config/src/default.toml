# Seraphim configuration.
#
# Location: $XDG_CONFIG_HOME/seraphim/config.toml (usually
# ~/.config/seraphim/config.toml). Every setting is optional; this file
# lists the defaults. Command-line options override it.
#
# Layering: preset < theme colors < this file < the active profile.
#   preset   = a background scene with its interactions: built-in "heavens"
#              (animated sky that reacts to root shells and installs), or
#              presets/<name>.toml (a file of [[background]], [[on]] and
#              [visual] keys, written exactly like the ones below)
#   theme    = built-in "celestial", "monochrome", "daylight", or
#              themes/<name>.toml (a file of [colors] keys)
#   profile  = profiles/<name>.toml, any subset of these settings; switch at
#              runtime with Ctrl+Shift+P, reload files with Ctrl+Shift+R.
# theme = "celestial"
# profile = "work"
# preset = "heavens"

# Apply changes to these files (and shaders, images, profiles, themes) as
# soon as they are saved. Ctrl+Shift+R reloads by hand.
live_reload = true

# Reopen the last session's tabs, splits, directories and recent screen
# text at startup.
restore_session = false

[font]
# Family name; when unset, the first installed of JetBrains Mono, Fira Code,
# DejaVu Sans Mono, Liberation Mono, Noto Sans Mono is used.
# family = "JetBrains Mono"
# Size in points.
size = 11.0

[window]
columns = 100
rows = 30
# Space around the text grid, in logical pixels.
padding = 6.0
# The menu bar (File, Edit, View, Profiles, Help) is hidden until you tap
# Alt (Option), and hides again when you're done. true keeps it on screen
# (toggle at runtime with Ctrl+Shift+M).
menu_bar = false
# Window decorations: "system" (the desktop's title bar and borders),
# "seraphim" (Seraphim draws the title bar and its buttons; with the tab
# bar or menu bar at the top, the buttons go there; drag empty space to
# move the window, double-click to maximize) or "none" (no title bar).
# Without system decorations, the window's edges resize it. Takes effect
# in new windows.
decorations = "system"

[terminal]
# TERM for new sessions. "auto" uses xterm-seraphim (24-bit color in tmux,
# undercurl, cursor shapes) once `seraphim --install-terminfo` has installed
# it, else xterm-256color. Hosts you ssh into need the entry too (or use
# term = "xterm-256color").
term = "auto"
# Lines of history kept per session.
scrollback = 10000
# Treat emoji sequences (flags, skin tones, ZWJ sequences like 👩‍💻, keycaps,
# ❤️) and combining marks as single characters of the right width. Programs
# that count widths per codepoint (some shells) may misplace the cursor after
# such emoji; set to false for strict per-codepoint widths. Programs can
# also switch this themselves with mode 2027.
grapheme_clustering = true

[shell]
# Program to run; when unset, $SHELL (then your passwd entry, then /bin/sh).
# program = "/bin/zsh"
# args = ["-l"]

[clipboard]
# Let programs *read* the clipboard with OSC 52. Off by default: any program,
# including one running on a remote host over ssh, could read it. Programs
# may always *set* the clipboard.
allow_read = false

[colors]
foreground = "#e6e1f0"
background = "#14121f"
cursor = "#f5a6d0"
# Text drawn on top of a block cursor.
cursor_text = "#14121f"
selection_background = "#4a3b6b"
# Text color inside a selection; when unset, text keeps its own color.
# selection_foreground = "#ffffff"
# Draw bold text in colors 0-7 with the bright variants 8-15.
bold_is_bright = false
# ANSI colors 0-7 and 8-15.
normal = ["#2a273a", "#ff5577", "#8be9a8", "#f9d98b", "#89a8ff", "#c89bff", "#7fe0e8", "#d8d3e6"]
bright = ["#5c5775", "#ff7a96", "#a9f5bf", "#fce6a9", "#a8bfff", "#f5a6d0", "#a3eef2", "#ffffff"]

[visual]
# Freeze all animation and make transitions instant.
reduced_motion = false
# Frame-rate cap while something animates (nothing animates: no frames).
max_fps = 60
# Keep animating while the window is unfocused.
animate_unfocused = false
# Background opacity of the window (needs a compositor; text stays opaque).
window_opacity = 1.0
# Duration of scene changes when switching profiles, in milliseconds.
transition_ms = 400
# How scenes change: fade, slide, wipe, dissolve, zoom, blur, fade-through,
# or a .wgsl file (in transitions/ or next to this file) implementing
#   fn transition(uv: vec2<f32>, p: f32) -> vec4<f32>
# with from_scene(uv) / to_scene(uv) (premultiplied RGBA) and u.time.
transition = "fade"

[cursor]
# Glide between cells over this many milliseconds (0 jumps).
glide_ms = 80
# Leave a fading trail while gliding.
trail = false
# Fade in and out when blinking (0 blinks hard).
blink_fade_ms = 150
# Soft glow around the cursor, 0 to 1.
glow = 0.0
# A ring spreads from the cursor on each key press.
ripple = false
# Fade a new selection in over this many milliseconds.
selection_fade_ms = 90
# visual.reduced_motion turns the moving effects off.

# Background layers, bottom first. Kinds: solid, gradient, image (PNG),
# shader (built-in "aurora", "starfield", "heavens", or a .wgsl file in
# shaders/ implementing
#   fn shade(uv: vec2<f32>, px: vec2<f32>) -> vec4<f32>
# with u.time, u.resolution, p(P_<name>) for the params below and
# color(C_<name>) for the palette colors: "#rrggbb[aa]", "theme.background",
# "theme.foreground", "theme.cursor", "theme.selection", "theme.normal.0"-"7"
# or "theme.bright.0"-"7").
# Every layer takes opacity (0-1) and blend ("normal", "add", "multiply",
# "screen"). kind = "blur" blurs everything beneath it (params = { radius =
# 12 }); its opacity mixes blurred and sharp.
#
# [[background]]
# kind = "gradient"
# colors = ["#100c22", "#2a1844", "#0d0f1f"]
# angle = 90
#
# [[background]]
# kind = "shader"
# shader = "starfield"
# opacity = 0.8
# params = { density = 0.5, speed = 1.0 }
#
# [[background]]
# kind = "shader"
# shader = "aurora"
# blend = "screen"
# opacity = 0.7
# params = { speed = 0.3, intensity = 0.8, hue = 0.78 }
#
# Images: PNG, JPEG, WebP or GIF; animated GIF, WebP and APNG play.
# blur is a radius in image pixels; brightness, contrast and saturation
# (1 = unchanged) can be animated and bound like shader parameters.
# Videos (anything ffmpeg plays; needs ffmpeg on PATH) loop silently:
# [[background]]
# kind = "video"
# path = "~/Videos/rain.mp4"
# params = { brightness = 0.5 }
#
# [[background]]
# kind = "image"
# path = "~/Pictures/wallpaper.jpg"
# fit = "cover"
# opacity = 0.3
# blur = 12
# params = { brightness = 0.6, saturation = 0.8 }
#
# [[background]]
# id = "glow"
# kind = "shader"
# shader = "glow.wgsl"
# params = { pulse = 0.0 }
# palette = { tint = "theme.bright.5" }

# Interaction rules: when an event is published on the bus, animate a
# layer's shader parameter (or "opacity"). `when` matches the event's data;
# strings are globs and a list matches any entry. `from` jumps there first,
# for one-shot effects. easing: linear, ease, ease-in, ease-out,
# ease-in-out, ease-out-expo, ease-out-back, spring or instant.
# Events include session.privileged {root}, command.started {command},
# command.completed {exit_code, duration_ms}, terminal.bell, shell.prompt,
# session.cwd.changed {cwd} and terminal.title.changed {title}.
#
# [[on]]
# event = "terminal.bell"
# layer = "glow"
# param = "pulse"
# from = 1.0
# to = 0.0
# duration_ms = 600
# easing = "ease-out"

# Menu bar additions. A [[menu]] with the title of a built-in menu appends
# to it (replace = true replaces it); a new title goes before Help. Items
# run an action (listed below), type text into the shell, or switch profile. "&" marks the access key.
#
# [[menu]]
# title = "&Tools"
# items = [
#     { label = "&System Monitor", send = "htop\n" },
#     { separator = true },
#     { label = "&Work Profile", profile = "work" },
# ]
#
# Actions: new-window, open-file-manager, close-window, copy, paste,
# select-all, clear-scrollback, clear-and-reset, toggle-menu-bar,
# fullscreen, zoom-in, zoom-out, zoom-reset, scroll-top, scroll-bottom,
# profiles (the profile list), next-profile, reload-config,
# open-config-folder, shortcuts, about.

# Continuous bindings: a layer parameter follows a live value, eased over
# smoothing_ms. Sources: system.cpu (percent), system.memory (percent),
# system.load (load average per core), battery.level (percent),
# battery.charging (0 or 1), time.hour (0-24, local),
# terminal.last_exit_code, session.root, session.cwd, terminal.alt_screen;
# or the latest event of a kind with `event` and `field`. `input` (default:
# the source's range) maps linearly onto `output`; `map` maps exact values
# instead. With param = "color" (or "color.<name>"), `colors` maps exact
# values to colors.
#
# [[bind]]
# source = "system.cpu"
# layer = "sky"
# param = "speed"
# output = [0.6, 2.5]
#
# [[bind]]
# event = "command.completed"
# field = "exit_code"
# layer = "glow"
# param = "pulse"
# map = { "0" = 0.0, default = 1.0 }
#
# [[bind]]
# source = "terminal.last_exit_code"
# layer = "base"
# param = "color"
# colors = { "0" = "#f5a6d0", default = "#ff5577" }

# Named arrangements of tabs and panes (spec §9.5); open one from the
# View menu, with --layout NAME, or at startup with startup_layout.
# A pane runs the shell, a `command` (through the shell), or shows a
# `panel` (system, sessions, history, packages, settings, or an
# extension's "name:id"); `split` divides it into `first` and `second`.
#
# (set startup_layout = "dev" at the top of the file)
#
# [[layout]]
# name = "dev"
#
# [[layout.tab]]
# label = "code"
# pane = { split = "right", ratio = 0.6, first = { cwd = "~/src" }, second = { split = "down", first = { command = "htop" }, second = { panel = "history" } } }
#
# [[layout.tab]]
# label = "notes"
# profile = "work"

# Tabs (Ctrl+Shift+T new, Ctrl+Shift+W close, Ctrl+PgUp/PgDown switch,
# Alt+1..9 jump). bar: auto (shown with two or more tabs), always, never.
# label: {title}, {program}, {cwd} (last part of the directory), {index}.
# style: classic, powerline, rounded, slanted (these three draw their ends
# with Nerd Font glyphs) or minimal (no backgrounds; the active tab is
# underlined). Drag a tab out of the window (or Ctrl+Shift+L) to give it
# a window of its own.
[tabs]
bar = "auto"
icons = true
label = "{title}"
style = "classic"
position = "top"
min_width = 6
max_width = 32
close_button = true
new_tab_button = true

# Tab colors, "#rrggbb"; unset ones follow the theme.
# [tabs.colors]
# bar = "#100e1a"
# active_fg = "#14121f"
# active_bg = "#f5a6d0"
# inactive_fg = "#d8d3e6"
# inactive_bg = "#2a273a"
# accent = "#c89bff"

# Split panes (Ctrl+Shift+E right, Ctrl+Shift+O down, Ctrl+Shift+X close,
# Alt+arrows focus, Ctrl+Alt+arrows resize, Ctrl+Shift+Z zoom).
[panes]
divider = 2.0
dim_inactive = 0.25

# Lua extensions: folders in extensions/ (extension.toml + init.lua) and
# one-file scripts in scripts/*.lua, next to this file. Each runs in its
# own sandbox on a script thread; a handler that runs longer than
# budget_ms is stopped, and an extension that keeps doing it is disabled.
[scripting]
enabled = true
budget_ms = 50
memory_mb = 64

# What an extension may do. It gets the permissions it asks for in its
# manifest *and* that are granted here; by default: visual, interface,
# metrics. The others: terminal.read, terminal.write (never into a root
# shell), process.read, process.exec (with `commands`), filesystem (with
# `paths`), network (with `hosts`), system (desktop notifications).
#
# [extensions.git-status]
# grant = ["visual", "interface", "terminal.read", "process.exec"]
# commands = ["git"]
# settings = { branch_colors = true }
#
# [extensions.noisy]
# disabled = true
