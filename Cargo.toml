[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
seraphim-terminal = { path = "crates/seraphim-terminal" }
seraphim-pty = { path = "crates/seraphim-pty" }
seraphim-events = { path = "crates/seraphim-events" }
seraphim-session = { path = "crates/seraphim-session" }
seraphim-render = { path = "crates/seraphim-render" }
seraphim-config = { path = "crates/seraphim-config" }
seraphim-visual = { path = "crates/seraphim-visual" }
seraphim-script = { path = "crates/seraphim-script" }
vte = "0.15"
unicode-width = "0.2"
unicode-segmentation = "1"
unicode-normalization = "0.1"
nix = { version = "0.31", features = ["term", "process", "signal", "fs", "ioctl"] }
libc = "0.2"
serde_json = "1"
wgpu = "30"
winit = "0.30"
swash = "0.2"
fontdb = "0.24"
bytemuck = "1"
pollster = "1"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
miniz_oxide = { version = "0.8", features = ["with-alloc"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

[profile.release]
debug = "line-tables-only"
